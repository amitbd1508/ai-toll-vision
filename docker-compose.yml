services:
  ai-toll-vision:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./videos:/app/videos
      - ./outputs:/app/outputs
      - ./models:/app/models
      - ./backend/database:/app/backend/database
    environment:
      - PYTHONUNBUFFERED=1
